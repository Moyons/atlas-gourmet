<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Gourmet</title>
<meta name="description" content="Tu atlas personal de restaurantes: los que has vivido y los que sueñas visitar.">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="rays" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="top" id="top">
  <a class="brand" href="#" id="brand"><span class="brand-mark">✦</span><span>Atlas <em>Gourmet</em></span></a>
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab active" data-view="visited" role="tab">Diario</button>
    <button class="tab" data-view="wish" role="tab">Lista de deseos</button>
    <button class="tab" data-view="map" role="tab">Mapa</button>
    <button class="tab" data-view="stats" role="tab">Cifras</button>
    <span class="tab-ink" id="ink"></span>
  </nav>
  <div class="top-actions">
    <button class="btn ghost" id="btn-data">Datos</button>
    <button class="btn gold" id="btn-add">+ Añadir</button>
  </div>
</header>

<section class="hero" id="hero">
  <div class="reel" id="reel"></div>
  <div class="hero-shade"></div>
  <div class="hero-in" id="hero-in">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="hero-cta" id="hero-cta"></div>
  </div>
  <div class="counters" id="counters"></div>
  <div class="scroll-cue" aria-hidden="true"><span></span></div>
</section>

<div class="marquee" id="marquee" aria-hidden="true"></div>

<main id="view"></main>

<nav class="bottom" id="bottom">
  <button data-view="visited" class="on"><b>❦</b><span>Diario</span></button>
  <button data-view="wish"><b>✧</b><span>Deseos</span></button>
  <button class="plus" id="bn-add" aria-label="Añadir">+</button>
  <button data-view="map"><b>◎</b><span>Mapa</span></button>
  <button data-view="stats"><b>◔</b><span>Cifras</span></button>
</nav>

<div class="detail" id="detail" aria-hidden="true"></div>
<div class="modal-root" id="modal-root" aria-hidden="true"></div>
<div class="lightbox" id="lightbox"></div>
<div class="toast" id="toast"></div>
<input type="file" id="import-file" accept="application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
